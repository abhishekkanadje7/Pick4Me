{% extends "base.html" %}

{% block title %}Customer Login - Pick4Me{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding-top: 3rem; padding-bottom: 4rem;">
  <div class="card" style="padding: 2.5rem; max-width: 520px; margin: 0 auto; box-shadow: var(--shadow-lg); border-top: 5px solid var(--primary);">
    
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <span class="badge badge-customer" style="margin-bottom: 0.5rem;">Customer Portal</span>
      <h2 style="font-size: 1.8rem; margin-bottom: 0.35rem;">Customer Login 👤</h2>
      <p style="font-size: 0.95rem;">Order store items & track live deliveries</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="Enter your customer email"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 0.85rem; font-size: 1rem;">
        Log In as Customer &rarr;
      </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; font-size: 0.88rem;">
      <a href="{{ url_for('register') }}?role=customer">Create Customer Account</a>
      <a href="{{ url_for('login_shopper') }}" style="color: var(--accent-dark);">Shopper / Store Login &rarr;</a>
    </div>
  </div>
</div>
{% endblock %}
